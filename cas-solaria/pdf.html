<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Téléchargement PDF Solaria AER</title><style>html,body{margin:0;width:0;height:0;overflow:hidden;background:transparent}</style></head><body><script>(async()=>{const parts=['part00.txt','part01.txt','part02.txt','part03.txt','part04.txt','part05.txt'];let b64='';for(const p of parts){const r=await fetch('aer-pdf/'+p+'?v=20261005-exact-aer',{cache:'no-store'});if(!r.ok)throw new Error('PDF part '+p);b64+=(await r.text()).trim();}const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const blob=new Blob([bytes],{type:'application/pdf'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Cas_reel_InvestEU_Solaria_AER_style.pdf';document.body.appendChild(a);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),15000);})();</script></body></html>
