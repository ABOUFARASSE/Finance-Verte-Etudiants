<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF - Cas Solaria InvestEU</title><style>body{font-family:Inter,system-ui,Arial,sans-serif;background:#f5f8fa;color:#263244;margin:0}.wrap{max-width:760px;margin:70px auto;padding:28px;background:#fff;border:1px solid #dfe6ee;border-radius:16px;box-shadow:0 8px 24px rgba(20,33,61,.06)}h1{color:#14213d}.btn{display:inline-block;border:0;border-radius:9px;padding:12px 16px;font-weight:750;text-decoration:none;cursor:pointer;background:#0f766e;color:#fff}.back{display:inline-block;margin-left:8px;padding:12px 16px;border-radius:9px;background:#eaf0f5;color:#14213d;text-decoration:none;font-weight:700}</style><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script></head><body><main class="wrap"><h1>Cas réel InvestEU - Solaria European PV Green Loan</h1><p>Version complète de l'exercice avec corrections et explications.</p><button class="btn" id="download">Télécharger le PDF</button><a class="back" href="/Finance-Verte-Etudiants/cas-solaria/">Retour au cas</a></main><script>
const sections=[
['INTRO','Objectif pédagogique','Analyser un dossier réel comme un comité d’investissement, formuler une décision autonome à partir du Scoreboard officiel InvestEU, puis comparer ce vote à la décision effectivement prise par l’Investment Committee.'],
['INTRO','Règle de l’exercice','Le Scoreboard sert à instruire la décision. Les Conclusions officielles ne doivent être consultées qu’après le vote du comité.'],
['INFO','Données du cas','Technologie : solaire photovoltaïque. Portefeuille : environ 120 centrales. Capacité totale : environ 5,6 GW. Pays : Espagne, Italie, Portugal. Partenaire de mise en œuvre : Banque européenne d’investissement (EIB).'],
['STEP','Étape 1 - Comprendre l’opération avant de juger','QUESTION : Avant même de parler de garantie publique, quels éléments faut-il comprendre pour considérer qu’il s’agit d’une opération d’infrastructure verte crédible ?\n\nCORRECTION : Le premier travail du comité est de distinguer le projet physique de son montage financier. L’actif est identifiable : production solaire photovoltaïque à grande échelle, déployée dans trois pays, avec un portefeuille important et des besoins de raccordement au réseau. Le comité doit ensuite vérifier que le projet répond à un objectif public éligible et que le financement proposé traite une difficulté que le marché ne résout pas seul. Une analyse crédible doit couvrir au minimum la technologie et sa maturité, la taille du portefeuille, les pays d’implantation, les besoins de raccordement, le sponsor, le partenaire financier, le calendrier de construction et les principaux risques d’exécution.\n\nÀ RETENIR : Une technologie verte ne suffit pas à justifier une intervention publique. Il faut aussi démontrer le besoin de financement, l’additionalité et la cohérence du montage.'],
['STEP','Étape 2 - Identifier la défaillance de marché','QUESTION : Pourquoi une garantie InvestEU peut-elle être pertinente alors que le solaire est déjà une technologie mature ? Distinguez le bénéfice environnemental du problème de financement.\n\nCORRECTION : Deux logiques doivent être séparées. Premièrement, la production solaire réduit des externalités négatives liées au carbone et à la pollution atmosphérique. Deuxièmement, un programme de construction de très grande ampleur peut rencontrer des contraintes de financement : maturité insuffisante, appétit bancaire limité, exposition au risque marchand ou difficulté à mobiliser rapidement un volume important de dette. Le rôle du comité n’est donc pas seulement de vérifier que le projet est vert. Il doit établir qu’une contrainte financière existe réellement et que la garantie publique contribue à la corriger.\n\nÀ RETENIR : La justification économique d’InvestEU repose sur une combinaison : objectif public + défaillance de marché + besoin de financement.'],
['STEP','Étape 3 - Tester l’additionalité','QUESTION : Si le projet pouvait être financé exactement aux mêmes conditions sans InvestEU, l’opération serait-elle encore additionnelle ? Quels éléments du Scoreboard faut-il rechercher ?\n\nCORRECTION : Non. L’additionalité suppose que l’intervention apporte quelque chose que le marché n’aurait pas fourni de manière équivalente. Le comité doit examiner la maturité proposée, la flexibilité du financement de construction, le risque marchand assumé, la rapidité de déploiement et la capacité à financer le portefeuille même lorsqu’une partie des actifs n’est pas encore couverte par un PPA au financial close. L’argument pertinent n’est donc pas « l’EIB finance un projet vert », mais plutôt : l’EIB permet une structure, une maturité ou un partage du risque qui ne seraient pas aisément disponibles aux mêmes conditions sur le marché commercial.\n\nÀ RETENIR : Additionalité ≠ simple présence d’un acteur public. Elle correspond à une amélioration identifiable du financement, du partage du risque, de la maturité ou de la capacité de réalisation.'],
['STEP','Étape 4 - Prendre la décision du comité','QUESTION : Sur la base du Scoreboard uniquement, quelle recommandation formulez-vous : APPROVE, APPROVE WITH CONDITIONS ou REJECT / DEFER ? Justifiez votre choix à partir de quatre dimensions.\n\nGRILLE DE CORRECTION : Une recommandation solide doit relier quatre dimensions : contribution environnementale ; défaillance de marché ; additionalité du financement ; principal risque ou condition à surveiller. Une réponse approve ou approve with conditions peut être défendable si elle est correctement argumentée. L’objectif n’est pas de deviner la réponse officielle mais de produire un raisonnement de comité cohérent.\n\nÀ RETENIR : Un comité ne vote pas sur la technologie seule : il vote sur une opération complète, avec son objectif, sa structure financière, ses risques et la justification de l’intervention publique.'],
['STEP','Étape 5 - Découvrir la décision réelle du comité InvestEU','DÉCISION OFFICIELLE : APPROVED. L’Investment Committee du Fonds InvestEU a approuvé le 6 juillet 2023 l’utilisation de la garantie InvestEU pour l’opération Solaria European PV Green Loan. Les Conclusions officielles retiennent notamment la réduction des externalités climatiques et environnementales ainsi que l’additionalité du financement. L’EIB apporte une structure de financement significative et flexible pour un programme de construction de grande ampleur, alors que les banques commerciales restent réticentes à offrir un financement comparable avec une exposition au risque marchand et une maturité similaire.\n\nQUESTION DE DÉBRIEF : Votre vote était-il le même ? Si non, quel élément aviez-vous sous-pondéré : impact, défaillance de marché, additionalité, risque ou structure financière ?\n\nMESSAGE FINAL : Le Scoreboard sert à instruire la décision ; les Conclusions permettent ensuite d’observer comment un comité réel a finalement arbitré.'],
['SYNTH','Synthèse - Les cinq questions d’un comité d’investissement vert','1. Que finance-t-on ? Nature de l’actif, technologie, taille, sponsor, pays, calendrier.\n2. Pourquoi l’intervention publique ? Objectif public et défaillance de marché clairement identifiée.\n3. Quelle additionalité ? Ce que le financement public apporte au-delà du marché commercial.\n4. Quels risques ? Construction, marché, raccordement, prix, exécution, structure financière.\n5. Quelle décision ? Approve, approve with conditions, reject/defer - avec justification explicite.'],
['SYNTH','Conclusion','Le cas Solaria montre que la finance verte ne consiste pas uniquement à identifier un actif bas-carbone. La décision d’un comité porte sur la combinaison entre impact environnemental, nécessité économique de l’intervention, qualité du financement, additionalité et risques. La qualité de la décision dépend donc autant du raisonnement financier que du caractère vert du projet.']
];
function downloadPDF(){const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4'});const W=210,M=16,maxW=W-2*M;let y=18;pdf.setProperties({title:'Cas réel InvestEU - Solaria - Exercice corrigé',author:'Badr ABOUFARASSE'});pdf.setTextColor(20,33,61);pdf.setFont('helvetica','bold');pdf.setFontSize(16);pdf.text('Cas réel InvestEU - Solaria European PV Green Loan',M,y);y+=8;pdf.setFont('helvetica','normal');pdf.setFontSize(9.5);pdf.setTextColor(90);pdf.text('Exercice de comité d’investissement - version complète avec corrections et explications',M,y);y+=11;
function ensure(h){if(y+h>282){pdf.addPage();y=18;}}
function para(txt,size=9.5,style='normal',color=[38,50,68],gap=4){pdf.setFont('helvetica',style);pdf.setFontSize(size);pdf.setTextColor(...color);const lines=pdf.splitTextToSize(txt,maxW);ensure(lines.length*(size*0.38)+gap);pdf.text(lines,M,y);y+=lines.length*(size*0.38)+gap;}
for(const [type,title,txt] of sections){if(type==='STEP'||type==='SYNTH'){ensure(18);para(title,13,'bold',[20,33,61],5);}else{para(title+'.',10,'bold',[20,33,61],2);}for(const block of txt.split('\n\n')){if(block.startsWith('QUESTION')) para(block,9.5,'bold',[20,33,61],4);else if(block.startsWith('CORRECTION')||block.startsWith('GRILLE')||block.startsWith('DÉCISION')) para(block,9.3,'normal',[38,50,68],4);else if(block.startsWith('À RETENIR')||block.startsWith('MESSAGE FINAL')) para(block,9.3,'bold',[120,82,20],5);else para(block,9.3,'normal',[38,50,68],4);}y+=2;}
para('Documents de référence : Scoreboard officiel InvestEU - Solaria European PV Green Loan ; Conclusions officielles de l’Investment Committee InvestEU.',8.5,'normal',[102,112,133],0);pdf.save('Cas_reel_InvestEU_Solaria_Exercice_corrige.pdf');}
document.getElementById('download').addEventListener('click',downloadPDF);if(new URLSearchParams(location.search).get('download')==='1')setTimeout(downloadPDF,500);
</script></body></html>
