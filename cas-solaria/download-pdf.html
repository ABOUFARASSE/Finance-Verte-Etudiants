<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Téléchargement PDF académique - Solaria</title>
<style>body{font-family:Georgia,serif;max-width:720px;margin:60px auto;padding:0 24px;line-height:1.6;color:#111}button{background:#0f766e;color:#fff;border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer}</style>
</head>
<body>
<h1>Cas réel InvestEU - Solaria</h1>
<p>Le PDF académique de l'exercice est prêt à être téléchargé.</p>
<button id="download">Télécharger le PDF académique</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const {jsPDF}=window.jspdf;
function makePDF(){
 const d=new jsPDF({unit:'mm',format:'a4'}), L=18, R=192, W=R-L;
 let y=18, page=1;
 function footer(){d.setFont('times','normal');d.setFontSize(8);d.text('Finance Verte - Cas réel InvestEU Solaria',L,287);d.text('Page '+page,R,287,{align:'right'});}
 function newPage(){footer();d.addPage();page++;y=18;}
 function title(t,s=15){d.setFont('times','bold');d.setFontSize(s);const a=d.splitTextToSize(t,W);d.text(a,105,y,{align:'center'});y+=a.length*6+4;}
 function h(t){if(y>260)newPage();d.setFont('times','bold');d.setFontSize(12);const a=d.splitTextToSize(t,W);d.text(a,L,y);y+=a.length*5.5+3;}
 function p(t,bold=false){d.setFont('times',bold?'bold':'normal');d.setFontSize(10);const a=d.splitTextToSize(t,W);if(y+a.length*4.7>270)newPage();d.text(a,L,y,{maxWidth:W,align:'justify'});y+=a.length*4.7+3;}
 function box(label,text){const a=d.splitTextToSize(label+' '+text,W-8);const hh=a.length*4.7+8;if(y+hh>270)newPage();d.setDrawColor(60);d.rect(L,y-4,W,hh);d.setFont('times','normal');d.setFontSize(10);d.text(a,L+4,y+1);y+=hh+5;}
 title('Cas réel InvestEU - Solaria European PV Green Loan',16);
 d.setFont('times','normal');d.setFontSize(10);d.text("Exercice de comité d'investissement - version complète avec corrections et explications",105,y,{align:'center'});y+=12;
 p("Objectif pédagogique. Analyser un dossier réel comme un comité d'investissement, formuler une décision autonome à partir du Scoreboard officiel InvestEU, puis comparer cette décision à celle effectivement prise par l'Investment Committee.");
 p("Principe de l'exercice. Le Scoreboard sert à instruire la décision. Les Conclusions officielles ne sont consultées qu'après le vote du comité, afin d'éviter d'orienter le raisonnement des étudiants.");
 h("1. Comprendre l'opération avant de juger");
 box('Question.','Avant même de parler de garantie publique, quels éléments faut-il comprendre pour considérer qu’il s’agit d’une opération d’infrastructure verte crédible ?');
 box('Correction.',"Le premier travail du comité est de distinguer le projet physique de son montage financier. L'actif est clairement identifiable : production solaire photovoltaïque à grande échelle, déployée dans trois pays, avec un portefeuille important et des besoins de raccordement au réseau. Le comité doit ensuite vérifier que le projet répond à un objectif public éligible et que le financement proposé traite effectivement une difficulté que le marché ne résout pas seul. Une analyse crédible doit couvrir la technologie, la taille du portefeuille, les pays d'implantation, les besoins de raccordement, le sponsor, le partenaire financier, le calendrier et les principaux risques d'exécution.");
 box('Idée clé.','Une technologie verte ne suffit pas à justifier une intervention publique. Il faut aussi démontrer le besoin de financement, l’additionalité et la cohérence du montage.');
 newPage();
 h('2. Identifier la défaillance de marché');
 box('Question.','Pourquoi une garantie InvestEU peut-elle être pertinente alors que le solaire est déjà une technologie mature ? Distinguez le bénéfice environnemental du problème de financement.');
 box('Correction.',"Deux logiques doivent être séparées. Premièrement, la production solaire réduit des externalités négatives liées au carbone et à la pollution atmosphérique. Deuxièmement, un programme de construction de très grande ampleur peut rencontrer des contraintes de financement : maturité insuffisante, appétit bancaire limité, exposition au risque marchand ou difficulté à mobiliser rapidement un volume important de dette. Le rôle du comité n'est donc pas seulement de vérifier que le projet est vert : il doit établir qu'une contrainte financière existe réellement et que la garantie publique contribue à la corriger.");
 box('Idée clé.','La justification économique d’InvestEU repose sur une combinaison : objectif public + défaillance de marché + besoin de financement.');
 h('3. Tester l’additionalité');
 box('Question.','Si le projet pouvait être financé exactement aux mêmes conditions sans InvestEU, l’opération serait-elle encore additionnelle ? Quels éléments du Scoreboard faut-il rechercher ?');
 box('Correction.',"Non. L'additionalité suppose que l'intervention apporte quelque chose que le marché n'aurait pas fourni de manière équivalente. Le comité doit examiner la maturité proposée, la flexibilité du financement de construction, le risque marchand assumé, la rapidité de déploiement et la capacité à financer le portefeuille même lorsqu'une partie des actifs n'est pas encore couverte par un PPA au financial close. L'argument pertinent est que l'EIB permet une structure, une maturité ou un partage du risque qui ne seraient pas aisément disponibles aux mêmes conditions sur le marché commercial.");
 box('Idée clé.','Additionalité ≠ simple présence d’un acteur public. Elle correspond à une amélioration identifiable du financement, du partage du risque, de la maturité ou de la capacité de réalisation.');
 newPage();
 h('4. Prendre la décision du comité');
 box('Décision.','Sur la base du Scoreboard uniquement, quelle recommandation formulez-vous : APPROVE, APPROVE WITH CONDITIONS ou REJECT / DEFER ? Justifiez votre choix à partir de quatre dimensions.');
 p('APPROVE : le dossier justifie suffisamment l’usage de la garantie.');
 p('APPROVE WITH CONDITIONS : le dossier est acceptable, sous réserve de conditions ou de points de vigilance.');
 p('REJECT / DEFER : les éléments disponibles ne suffisent pas ou l’additionalité n’est pas démontrée.');
 box('Grille de correction.',"Une recommandation solide doit relier quatre dimensions : contribution environnementale ; défaillance de marché ; additionalité du financement ; principal risque ou condition à surveiller. Une réponse approve ou approve with conditions peut être défendable si elle est correctement argumentée. L'objectif n'est pas de deviner la réponse officielle mais de produire un raisonnement de comité cohérent.");
 box('Idée clé.','Un comité ne vote pas sur la technologie seule : il vote sur une opération complète, avec son objectif, sa structure financière, ses risques et la justification de l’intervention publique.');
 p('Avant de passer à la décision réelle, les étudiants doivent annoncer leur vote et formuler une justification courte, comme dans une vraie réunion de comité.');
 newPage();
 h('5. Découvrir la décision réelle du comité InvestEU');
 box('Décision officielle : APPROVED.',"L'Investment Committee du Fonds InvestEU a approuvé le 6 juillet 2023 l'utilisation de la garantie InvestEU pour l'opération Solaria European PV Green Loan.");
 p("Les Conclusions officielles retiennent notamment deux idées : d'une part, la réduction des externalités climatiques et environnementales ; d'autre part, l'additionalité du financement. L'EIB apporte une structure de financement significative et flexible pour un programme de construction de grande ampleur, alors que les banques commerciales restent réticentes à offrir un financement comparable avec une exposition au risque marchand et une maturité similaire.");
 box('Question de débrief.','Votre vote était-il le même ? Si non, quel élément aviez-vous sous-pondéré : impact, défaillance de marché, additionalité, risque ou structure financière ?');
 box('Message final.','Le Scoreboard sert à instruire la décision ; les Conclusions permettent ensuite d’observer comment un comité réel a finalement arbitré. L’intérêt pédagogique est de prendre d’abord une décision autonome, puis de la confronter à la décision officielle.');
 h('Synthèse - Les cinq questions d’un comité d’investissement vert');
 p('1. Que finance-t-on ? Nature de l’actif, technologie, taille, sponsor, pays, calendrier.');
 p('2. Pourquoi l’intervention publique ? Objectif public et défaillance de marché clairement identifiée.');
 p('3. Quelle additionalité ? Ce que le financement public apporte au-delà du marché commercial.');
 p('4. Quels risques ? Construction, marché, raccordement, prix, exécution, structure financière.');
 p('5. Quelle décision ? Approve, approve with conditions, reject/defer - avec justification explicite.');
 p('Conclusion. Le cas Solaria montre que la finance verte ne consiste pas uniquement à identifier un actif bas-carbone. La décision d’un comité porte sur la combinaison entre impact environnemental, nécessité économique de l’intervention, qualité du financement, additionalité et risques.');
 footer();
 d.save('Cas_reel_InvestEU_Solaria_Exercice_corrige_academique_v2.pdf');
}
document.getElementById('download').addEventListener('click',makePDF);
setTimeout(makePDF,400);
</script>
</body></html>
